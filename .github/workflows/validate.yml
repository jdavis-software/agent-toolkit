name: Validate toolkit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - name: Check local publication artifacts and synthetic media
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publication-evidence"
          python3 examples/publicationcheck/demo.py > "$RUNNER_TEMP/publication-evidence/records.json"
          python3 tools/publicationcheck.py site --root dist --base https://jdavis-software.github.io/agent-toolkit/ > "$RUNNER_TEMP/publication-evidence/site.json"
          python3 examples/publicationcheck/media-smoke.py > "$RUNNER_TEMP/publication-evidence/media.json"
      - name: Preserve publication checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-evidence
          path: ${{ runner.temp }}/publication-evidence/
          retention-days: 7
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:site
      - name: Qualify direct public HTTPS reading against the existing public site
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sourcekit-live"
          node tools/sourcekit.mjs read https://jdavis-software.github.io/agent-toolkit/ --allow-host jdavis-software.github.io --expect-text 'Toolkit Collection' --require-content --include-links > "$RUNNER_TEMP/sourcekit-live/page.json"
          node tools/sourcekit.mjs read https://jdavis-software.github.io/agent-toolkit/build-info.json --allow-host jdavis-software.github.io --format text > "$RUNNER_TEMP/sourcekit-live/metadata.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sourcekit-live'
          for name in ['page','metadata']:
              packet=json.loads((root/(name+'.json')).read_text())
              assert packet['status']=='ok' and packet['source']['mode']=='live'
              assert packet['observations'][0]['httpStatus']==200
              assert packet['trust']=='untrusted-source-content'
              if name=='page':
                  assert 'Toolkit Collection' in packet['content']['text']
                  assert packet['contentAssessment']['state']=='expected-content'
                  assert packet['contentAssessment']['criteriaMatched'] is True
                  assert packet['content']['links']['items']
              else: assert json.loads(packet['content']['text'])['schemaVersion']==1
          print('Two authorized live public HTTPS reads passed; no authenticated platform access was tested.')
          PY
      - name: Preserve live public-read evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sourcekit-live-evidence
          path: ${{ runner.temp }}/sourcekit-live/
          retention-days: 7
      - name: Preserve build and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolkit-evidence
          path: |
            dist/
            test-results/
            playwright-report/
            pnpm-lock.yaml
          retention-days: 7
