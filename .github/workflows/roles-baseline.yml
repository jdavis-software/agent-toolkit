name: Export roles baseline
on:
  push:
    branches: [feat/specialist-roles-and-production]
    paths: [.github/workflows/roles-baseline.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 828f1101ae8ac6a0e91eaa7f08cd7c42d8ef9e61
          persist-credentials: false
      - run: git archive --format=tar HEAD > "$RUNNER_TEMP/roles-baseline.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roles-baseline
          path: ${{ runner.temp }}/roles-baseline.tar
          retention-days: 1
