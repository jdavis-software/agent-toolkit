name: Export staged category source
on:
  push:
    branches: [feat/categories-agentflow]
    paths: [.github/workflows/review-category-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > /tmp/category-staged.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: category-staged-source
          path: /tmp/category-staged.tar
          retention-days: 1
