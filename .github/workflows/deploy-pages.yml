name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: python3 tools/publicationcheck.py site --root dist --base https://jdavis-software.github.io/agent-toolkit/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify published revision, categories, bundles, and skill pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import html, json, os, time, urllib.request
          base=os.environ['PAGE_URL']
          assert base == 'https://jdavis-software.github.io/agent-toolkit/', 'Unexpected Pages destination'
          expected=os.environ['EXPECTED_SHA']
          def get(path):
              url=base+path+'?revision='+expected
              request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'agent-toolkit-pages-check'})
              with urllib.request.urlopen(request,timeout=15) as response:
                  assert response.status == 200, path
                  return response.read()
          for attempt in range(12):
              try:
                  info=json.loads(get('build-info.json'))
                  assert info['sourceRevision'] == expected, 'Published revision has not propagated'
                  assert info['counts'] == {'entries':121,'skills':112,'tools':9,'bundles':18,'categories':15,'roles':8}, info
                  entries=json.loads(get('catalog.json'))['entries']
                  bundles=json.loads(get('bundles.json'))['bundles']
                  assert len(entries)==121 and len(bundles)==18
                  assert len([e for e in entries if e['kind']=='skill'])==112
                  assert len(set(s for b in bundles for s in b['skills']))==112
                  categories=json.loads(get('categories.json'))['categories']
                  assert len(categories)==15 and sum(c['counts']['entries'] for c in categories)==121
                  assert len({i for c in categories for i in c['entryIds']})==121
                  roles=json.loads(get('roles.json'))['roles']
                  assert len(roles)==8 and len({r['id'] for r in roles})==8
                  for role in roles:
                      assert all(any(e['id']==sid and e['kind']=='skill' for e in entries) for sid in role['skills'])
                  for path,needle in [('roles/', 'A clear responsibility.'),('roles/architecture-reviewer/', 'read-only'),('skills/code-index-qualification/', 'Code Index Qualification'),('skills/media-timeline-assembly/', 'Media Timeline Assembly'),('bundles/engineering-methods/', 'Engineering Experiments and Data'),('categories/frontend-engineering/', 'Frontend Engineering'),('bundles/modern-react/', 'Modern React Applications'),('bundles/interface-design/', 'Interface Design Systems'),('examples/frontend-engineering/', 'hold together.'),('skills/icon-system-integration/', 'React Icons'),('skills/tanstack-query-engineering/', 'TanStack Query Engineering'),('examples/research-to-delivery/', 'a useful artifact.'),('bundles/research-to-delivery/', 'Research to Delivery'),('categories/design-communication/', 'Design & Communication'),('tools/publicationcheck/', 'Publicationcheck'),('skills/time-windowed-research/', 'Time-windowed Research'),('', 'Toolkit Collection'),('bundles/','Your stack.'),('bundles/typescript/','TypeScript Engineering'),('skills/typescript-7-adoption/','TypeScript 7 Adoption'),('skills/go-concurrency-cancellation/','Go Concurrency'),('tools/bundle-resolver/','Bundle Resolver'),('categories/','Explore by category'),('categories/agent-orchestration/','Agent Orchestration'),('tools/agentflow/','Agentflow'),('skills/orchestration-resume/','Orchestration Resume'),('categories/web-research/','Web & Research'),('tools/sourcekit/','Sourcekit'),('bundles/web-research/','Web Research and Source Access'),('skills/structured-web-extraction/','Structured Web Extraction'),('skills/mcp-server-qualification/','MCP Server Qualification'),('bundles/harness-engineering/','Harness Engineering and Qualification'),('tools/harnesskit/','Harnesskit'),('skills/execution-profile-audit/','Execution Profile Audit'),('skills/bounded-harness-canary/','Bounded Harness Canary'),('skills/context-checkpointing/','Executable file revalidation')]:
                      assert needle in html.unescape(get(path).decode('utf-8')), path
                  print(json.dumps({'publication':'verified','sourceRevision':expected,'counts':info['counts'],'url':base}))
                  break
              except Exception as error:
                  if attempt==11: raise
                  print('Waiting for matching public content:',str(error))
                  time.sleep(5)
          PY
