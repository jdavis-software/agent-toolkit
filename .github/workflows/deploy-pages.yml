name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify public collection endpoints
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test "$SITE_URL" = 'https://jdavis-software.github.io/agent-toolkit/'
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 30 "${SITE_URL}catalog.json?deployment=${GITHUB_SHA}" -o /tmp/catalog.json && python3 -c 'import json; d=json.load(open("/tmp/catalog.json")); assert d["schemaVersion"] == 2; assert len(d["entries"]) >= 22'; then
              curl --fail --silent --show-error --max-time 30 "${SITE_URL}sources/" -o /tmp/sources.html
              curl --fail --silent --show-error --max-time 30 "${SITE_URL}skills/anthropic-frontend-design/" -o /tmp/detail.html
              echo 'Public catalog, source directory, and included skill page responded successfully.'
              exit 0
            fi
            sleep 10
          done
          echo 'Public collection verification failed.' >&2
          exit 1
