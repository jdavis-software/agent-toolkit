name: Export source-access review inputs
on:
  push:
    branches: [feat/source-access-toolkit]
    paths: [.github/workflows/source-access-review.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1cb3272c9f99211dcbe624b372590616bcb3dca6
          persist-credentials: false
      - name: Archive source only; do not install or execute upstream code
        run: |
          set -euo pipefail
          mkdir /tmp/source-access-inputs
          git archive --format=tar HEAD > /tmp/source-access-inputs/toolkit.tar
          curl --fail --location --max-time 60 --proto '=https' --proto-redir '=https' 'https://codeload.github.com/Panniantong/Agent-Reach/tar.gz/a19a171fa980a0785849596492e0af4db800c82f' -o /tmp/source-access-inputs/upstream.tar.gz
          sha256sum /tmp/source-access-inputs/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-access-inputs
          path: /tmp/source-access-inputs/
          retention-days: 1
