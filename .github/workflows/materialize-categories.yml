name: Materialize reviewed categories and Agentflow
on:
  push:
    branches: [feat/categories-agentflow]
    paths: [.github/workflows/materialize-categories.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'jdavis-software/agent-toolkit' && github.ref == 'refs/heads/feat/categories-agentflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Complete reviewed public files
        run: |
          set -euo pipefail
          python .github/seed-agentflow.py
          python .github/finalize-categories.py
          node --test tests/skillcheck.test.mjs tests/bundles.test.mjs tests/agentflow.test.mjs tests/categories.test.mjs
          node examples/agentflow/demo.mjs
      - name: Commit content without modifying workflow definitions
        run: |
          set -euo pipefail
          # The job has contents permission, not workflows permission.
          # Discard only this script's generated workflow edit; the connector
          # applies and reviews that edit separately before publication.
          git show HEAD:.github/workflows/deploy-pages.yml > .github/workflows/deploy-pages.yml
          git rm .github/seed-agentflow.py .github/finalize-categories.py
          git add AGENTS.md README.md package.json catalog skills examples tools scripts src tests playwright.config.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: finalize 54 original skills, Agentflow, and 12 counted categories'
          git push origin HEAD:feat/categories-agentflow
          git archive --format=tar HEAD > /tmp/categories-final.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: categories-final-source
          path: /tmp/categories-final.tar
          retention-days: 7
