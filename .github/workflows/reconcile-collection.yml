name: Reconcile concurrent collection changes
on:
  push:
    branches: [feat/personal-collection]
    paths: [.github/workflows/reconcile-collection.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'jdavis-software/agent-toolkit' && github.ref == 'refs/heads/feat/personal-collection'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preserve original additions alongside the community collection
        run: |
          python3 scripts/reconcile-collection.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/entries.json README.md scripts/catalog.mjs src/layouts/Base.astro src/components/CatalogPage.astro src/pages/workflows/index.astro src/pages/sitemap.xml.ts tests/catalog.test.mjs tests/site.spec.ts AGENTS.md scripts/reconcile-collection.py .github/workflows/reconcile-collection.yml
          git commit -m 'fix: reconcile the concurrent original collection without losing skills'
          git push origin HEAD:feat/personal-collection
