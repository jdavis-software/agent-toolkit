name: Materialize reviewed research-to-delivery patch
on:
  push:
    branches: [feat/research-communication-delivery]
    paths: [.github/workflows/materialize-delivery-wave.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'jdavis-software/agent-toolkit' && github.ref == 'refs/heads/feat/research-communication-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify and materialize source only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, os, pathlib
          data=b''.join(pathlib.Path(f'.github/delivery-part-{i}.bin').read_bytes() for i in range(6))
          assert len(data)==38252
          assert hashlib.sha256(data).hexdigest()=='60947b900c4e4152f32962f0e2b62ef223a55af0c8df4e278fbae1d06d2f7fc4'
          decoder=lzma.LZMADecompressor(memlimit=268435456)
          patch=decoder.decompress(data,max_length=1000001)
          assert decoder.eof and not decoder.unused_data and len(patch)==166995
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'delivery.patch').write_bytes(patch)
          PY
          # This job does not have workflows permission. The authorized connector
          # will separately apply reviewed workflow changes and remove staging.
          git apply --check --exclude='.github/workflows/*' "$RUNNER_TEMP/delivery.patch"
          git apply --index --exclude='.github/workflows/*' "$RUNNER_TEMP/delivery.patch"
          git rm .github/delivery-part-*.bin
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add original research, communication and delivery source and fixtures'
          git push origin HEAD:feat/research-communication-delivery
