name: Export reviewed wave baseline
on:
  push:
    branches: [feat/research-communication-delivery]
    paths: [.github/workflows/review-wave-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: cb53b545e40ac71b58cfbad9f0e8760b801ea795
          persist-credentials: false
      - run: git archive --format=tar HEAD > "$RUNNER_TEMP/review-wave-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-wave-source
          path: ${{ runner.temp }}/review-wave-source.tar
          retention-days: 1
