name: Materialize original web qualification packages
on:
  push:
    branches: [feat/web-access-qualification]
    paths: [.github/workflows/materialize-web-qualification.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'jdavis-software/agent-toolkit' && github.ref == 'refs/heads/feat/web-access-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Materialize reviewed instructions and metadata
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 .github/author-qualification.py
          python3 .github/integrate-qualification.py
          python3 -m unittest discover -s tests -p 'test_sourcekit*.py' -q
          python3 examples/sourcekit/assessment-demo.py
          node --test tests/skillcheck.test.mjs tests/bundles.test.mjs tests/agentflow.test.mjs tests/categories.test.mjs
          git add -- . ':!.github/workflows'
          git rm .github/author-qualification.py .github/integrate-qualification.py .github/sourcekit-addendum.md .github/qualification-browser-tests.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate four original web qualification skills and Sourcekit content assessment'
          git push origin HEAD:feat/web-access-qualification
          git archive --format=tar HEAD > "$RUNNER_TEMP/web-qualification-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-qualification-source
          path: ${{ runner.temp }}/web-qualification-source.tar
          retention-days: 3
