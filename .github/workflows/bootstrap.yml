# Temporary first-build workflow. Remove after the lockfile has been generated.
name: Bootstrap and verify
on:
  push:
    branches: ['setup/initial-toolkit']
permissions:
  contents: write
concurrency:
  group: toolkit-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - name: Generate the initial dependency lock
        shell: bash
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            pnpm install --lockfile-only
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'build: lock initial dependency graph'
            git push origin HEAD:setup/initial-toolkit
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:site
      - name: Preserve build and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolkit-evidence
          path: |
            dist/
            test-results/
            playwright-report/
            pnpm-lock.yaml
          retention-days: 7
