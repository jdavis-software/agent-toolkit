name: Review collection inputs
on:
  push:
    branches: [feat/personal-collection]
    paths: [.github/workflows/collection-inputs.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Snapshot current implementation and pinned public upstreams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collection-inputs"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/collection-inputs/toolkit.tar.gz"
          while read -r label repo revision; do
            curl --fail --silent --show-error --location --max-time 90 "https://codeload.github.com/${repo}/tar.gz/${revision}" -o "$RUNNER_TEMP/collection-inputs/${label}.tar.gz"
          done <<'SOURCES'
          vercel vercel-labs/agent-skills 063bee94c3f4df8453406c830b0a7df0f2860278
          ecc affaan-m/ECC dd6ee538aee0f548d4a6b520118f875431fd749e
          superpowers obra/superpowers b36e0829c6d0140e93cfef2ca599b1b07d4a7797
          anthropic anthropics/skills 34040c9c568585f6929bedeaad110ad08f079624
          supabase supabase/agent-skills 8331f910845103c08d51f6ca1d86ebb7d1f745e3
          SOURCES
          sha256sum "$RUNNER_TEMP/collection-inputs/"*.tar.gz > "$RUNNER_TEMP/collection-inputs/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collection-inputs
          path: ${{ runner.temp }}/collection-inputs/
          retention-days: 1
