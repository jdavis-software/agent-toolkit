name: Qualify practical integration
on:
  push:
    branches: [codex/toolkit-practical-integration]
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'catalog/roles.json'
      - 'scripts/inventory.mjs'
      - '.github/workflows/qualify-practical-integration.yml'
permissions:
  contents: read
concurrency:
  group: practical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Qualify dependency-free helpers
        run: |
          node scripts/inventory.mjs
          node --test tests/practical-integration.test.mjs tests/harnesskit.test.mjs tests/bundles.test.mjs tests/skillcheck.test.mjs tests/agentflow.test.mjs
      - name: Preserve reviewed source for isolated qualification
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/practical-evidence"
          git archive --format=tar HEAD > "$RUNNER_TEMP/practical-evidence/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/practical-evidence/revision.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practical-integration-evidence
          path: ${{ runner.temp }}/practical-evidence/
          retention-days: 3
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Provision explicit temporary tool versions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toolkit-bin" "$RUNNER_TEMP/nx-fixture" "$RUNNER_TEMP/tool-evidence"
          GOBIN="$RUNNER_TEMP/toolkit-bin" go install golang.org/x/tools/gopls@v0.23.0
          GOBIN="$RUNNER_TEMP/toolkit-bin" go install github.com/oasdiff/oasdiff@v1.32.1
          npm install --global pnpm@12.4.2
          printf '{"private":true}' > "$RUNNER_TEMP/nx-fixture/package.json"
          pnpm --dir "$RUNNER_TEMP/nx-fixture" add --save-exact nx@23.2.1
          cp "$RUNNER_TEMP/nx-fixture/pnpm-lock.yaml" "$RUNNER_TEMP/tool-evidence/nx-fixture-lock.yaml"
      - name: Exercise actual upstream tools on disposable fixtures
        run: node evals/practical-tooling/qualify.mjs --gopls "$RUNNER_TEMP/toolkit-bin/gopls" --oasdiff "$RUNNER_TEMP/toolkit-bin/oasdiff" --nx-package "$RUNNER_TEMP/nx-fixture" > "$RUNNER_TEMP/tool-evidence/result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practical-upstream-tool-evidence
          path: ${{ runner.temp }}/tool-evidence/
          retention-days: 7
