name: Materialize reviewed context evidence patch
on:
  push:
    branches: [feat/context-canary-evidence]
    paths: [.github/workflows/materialize-context-evidence.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'jdavis-software/agent-toolkit' && github.ref == 'refs/heads/feat/context-canary-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify original source patch and run bounded helper checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/context-evidence"
          python3 - <<'PY'
          import hashlib, lzma, os, pathlib
          data=b''.join(pathlib.Path(f'.github/context-part-{i}.bin').read_bytes() for i in range(4))
          assert len(data)==23660
          assert hashlib.sha256(data).hexdigest()=='79f6acabd08473af1c77ec53c778a36726614d3a790a63257b5c927e992bc2d9'
          decoder=lzma.LZMADecompressor(memlimit=268435456)
          patch=decoder.decompress(data,max_length=1000001)
          assert decoder.eof and not decoder.unused_data and len(patch)==94494
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'context.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/context.patch"
          git apply --index "$RUNNER_TEMP/context.patch"
          node --test tests/skillcheck.test.mjs tests/bundles.test.mjs tests/agentflow.test.mjs tests/harnesskit.test.mjs tests/harness-evidence.test.mjs > "$RUNNER_TEMP/context-evidence/helpers.tap"
          python3 -m unittest discover -s tests -p 'test_sourcekit*.py' -q
          node examples/harnesskit/evidence-demo.mjs > "$RUNNER_TEMP/context-evidence/demo.json"
          node tools/harnesskit.mjs canary examples/harnesskit/canary.json > "$RUNNER_TEMP/context-evidence/canary.json"
          git rm .github/context-part-*.bin
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add original context revalidation and bounded canary evidence'
          git push origin HEAD:feat/context-canary-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-evidence-helpers
          path: ${{ runner.temp }}/context-evidence/
          retention-days: 7
