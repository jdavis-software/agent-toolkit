name: Qualify optional web parser
on:
  pull_request:
    paths:
      - evals/scrapling/**
      - skills/structured-web-extraction/**
      - .github/workflows/qualify-web-parser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Create an isolated, hash-pinned parser-only environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/parser-qualification"
          "$RUNNER_TEMP/parser-qualification/bin/python" -m pip install --require-hashes --only-binary=:all: -r evals/scrapling/requirements-linux-py313.lock
      - name: Run original extraction-contract fixtures without network or browsers
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/parser-qualification/bin/python" evals/scrapling/qualify.py > "$RUNNER_TEMP/parser-qualification.json"
      - name: Preserve fixture outcomes and dependency versions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optional-parser-qualification
          path: ${{ runner.temp }}/parser-qualification.json
          retention-days: 7
