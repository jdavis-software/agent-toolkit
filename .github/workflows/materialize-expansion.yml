name: Materialize reviewed engineering expansion
on:
  push:
    branches: [feat/reusable-engineering-skills]
    paths: [.github/workflows/materialize-expansion.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'jdavis-software/agent-toolkit' && github.ref == 'refs/heads/feat/reusable-engineering-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Materialize original public packages and catalog bindings
        run: |
          set -euo pipefail
          python .github/expand-skills.py
          python .github/finalize-expansion.py
          node --test tests/skillcheck.test.mjs tests/bundles.test.mjs
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[]
          for e in json.loads(Path('catalog/entries.json').read_text()):
            if e['kind']!='skill': continue
            source=Path(e['sourcePath']).read_text()
            title=re.search(r'^# (.+)$',source,re.M)[1]
            rows.append('| ['+title.replace('|','\\|')+']('+e['sourcePath']+') | '+e['category']+' |')
          p=Path('README.md');t=p.read_text();a='<!-- skill-index:start -->';b='<!-- skill-index:end -->'
          p.write_text(t[:t.index(a)+len(a)]+'\n\n| Skill | Area |\n| --- | --- |\n'+'\n'.join(rows)+'\n\n'+t[t.index(b):])
          PY
      - name: Commit only the complete public expansion and remove staging
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/expand-skills.py .github/finalize-expansion.py .github/workflows/materialize-expansion.yml
          git add skills catalog/entries.json README.md AGENTS.md docs/ROADMAP.md
          git diff --cached --check
          git commit -m 'feat: materialize 30 original domain skills and integrate reusable bundles'
          git push origin HEAD:feat/reusable-engineering-skills
          git archive --format=tar HEAD > /tmp/engineering-expansion.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-expansion-source
          path: /tmp/engineering-expansion.tar
          retention-days: 7
