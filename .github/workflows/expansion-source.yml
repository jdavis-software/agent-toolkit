name: Export expansion baseline
on:
  push:
    branches: [feat/reusable-engineering-skills]
    paths: [.github/workflows/expansion-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: git archive --format=tar bbcea28eaf40b49915c95b333c38143c069cf4b1 > /tmp/toolkit-baseline.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expansion-baseline
          path: /tmp/toolkit-baseline.tar
          retention-days: 1
