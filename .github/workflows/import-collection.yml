name: Import reviewed collection
on:
  push:
    branches: [feat/personal-collection]
    paths: [.github/workflows/import-collection.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'jdavis-software/agent-toolkit' && github.ref == 'refs/heads/feat/personal-collection'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Copy only reviewed pinned public source packages
        run: |
          python3 scripts/seed-collection.py
          python3 scripts/import-upstream.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/entries.json catalog/upstreams.json catalog/upstream-lock.json vendor/
          git commit -m 'chore: import selected upstream source with licenses and integrity lock'
          git push origin HEAD:feat/personal-collection
