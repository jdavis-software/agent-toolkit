name: Finalize reviewed source skill files
on:
  push:
    branches: [feat/source-access-toolkit]
    paths: [.github/workflows/finalize-source-packages.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'jdavis-software/agent-toolkit' && github.ref == 'refs/heads/feat/source-access-toolkit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore the exact reviewed original packages without re-editing catalog metadata
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess, tempfile
          root=pathlib.Path.cwd()
          def source(ref,path):
              return subprocess.check_output(['git','show',ref+':'+path])
          with tempfile.TemporaryDirectory() as tmp:
              target=pathlib.Path(tmp)
              (target/'catalog').mkdir()
              for name in ['entries.json','bundles.json','categories.json']:
                  (target/'catalog'/name).write_bytes(source('1cb3272c9f99211dcbe624b372590616bcb3dca6','catalog/'+name))
              script=target/'seed.py'
              script.write_bytes(source('e82a956bf3a9431bd600f35f83264493f6f54808','.github/seed-source-access.py'))
              subprocess.run(['python3',str(script)],cwd=target,check=True)
              expected={'source-access-routing','connector-health-diagnostics','public-web-reading','feed-change-tracking','transcript-evidence-extraction','authenticated-source-access','multi-source-research','connector-setup-review'}
              assert {p.name for p in (target/'skills').iterdir()}==expected
              for name in sorted(expected):
                  dest=root/'skills'/name
                  assert not dest.exists(), name
                  shutil.copytree(target/'skills'/name,dest)
          entries=json.loads((root/'catalog/entries.json').read_text())
          for e in entries:
              if e['kind']=='skill': assert (root/e['sourcePath']).is_file(), e['id']
          PY
      - name: Verify and commit all selected source packages
        run: |
          set -euo pipefail
          node --test tests/skillcheck.test.mjs tests/bundles.test.mjs tests/categories.test.mjs tests/agentflow.test.mjs
          python3 -m unittest discover -s tests -p test_sourcekit.py -v
          git add skills
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: track all eight canonical source-access skill packages and scenarios'
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/source-access-toolkit
          git archive --format=tar HEAD > /tmp/sourcekit-complete.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sourcekit-complete
          path: /tmp/sourcekit-complete.tar
          retention-days: 7
